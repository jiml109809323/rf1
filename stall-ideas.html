<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stalls for Good | Stall Ideas</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./index.html" aria-label="Stalls for Good home">
        <img class="brand-logo" src="./logo-transparent.png" alt="Stalls for Good logo" />
        <span class="brand-text">Stalls for Good</span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a class="nav-link" href="./index.html">Home</a>
        <a class="nav-link is-active" href="./stall-ideas.html">Stall Ideas</a>
        <a class="nav-link" href="./start-a-stall.html">Start a Stall</a>
        <a class="nav-link" href="./donate.html">Donate</a>
        <a class="nav-link" href="./gallery.html">Gallery</a>
        <a class="nav-link" href="./about.html">About</a>
      </nav>
      <a class="button button-primary header-action" href="./start-a-stall.html">🎪 Make a Stall</a>
    </header>

    <div class="site-shell">
      <main class="stack-layout">
        <section class="page-header">
          <p class="eyebrow">⭐ Great ideas for kind stalls</p>
          <h1 class="page-title">Stall Ideas</h1>
          <p class="page-subtitle">
            Choose a stall type, then explore recipes, craft builds, toy-sale
            setups, or games that fit your idea.
          </p>
        </section>

        <section class="content-panel">
          <div class="idea-grid" id="idea-grid">
            <button
              class="idea-card"
              data-idea-id="bake-sale"
              aria-pressed="true"
              type="button"
            >
              <div class="idea-image" aria-hidden="true">🧁</div>
              <div class="idea-copy">
                <span class="idea-tag">Bake Sale</span>
                <h3>Bake delicious treats</h3>
                <p>Decorated cupcakes, brownies, fruit skewers, and lemonade are easy favourites.</p>
              </div>
            </button>
            <button
              class="idea-card"
              data-idea-id="craft-stall"
              aria-pressed="false"
              type="button"
            >
              <div class="idea-image" aria-hidden="true">🎨</div>
              <div class="idea-copy">
                <span class="idea-tag">Craft Stall</span>
                <h3>Make little treasures</h3>
                <p>Try friendship bracelets, bookmarks, badges, painted stones, or handmade cards.</p>
              </div>
            </button>
            <button
              class="idea-card"
              data-idea-id="toy-sale"
              aria-pressed="false"
              type="button"
            >
              <div class="idea-image" aria-hidden="true">🧸</div>
              <div class="idea-copy">
                <span class="idea-tag">Toy Sale</span>
                <h3>Find toys new homes</h3>
                <p>Sort clean toys, books, puzzles, or games and add simple price labels.</p>
              </div>
            </button>
            <button
              class="idea-card"
              data-idea-id="games-stall"
              aria-pressed="false"
              type="button"
            >
              <div class="idea-image" aria-hidden="true">🎮</div>
              <div class="idea-copy">
                <span class="idea-tag">Games Stall</span>
                <h3>Run a mini challenge</h3>
                <p>Lucky dip, hoop toss, tin-can alley, and hook-a-duck are fun for everyone.</p>
              </div>
            </button>
          </div>

          <div
            class="idea-detail-panel"
            id="idea-detail-panel"
            aria-live="polite"
          >
            <!-- Stall idea details are added by JavaScript -->
          </div>
        </section>

        <section
          class="content-panel idea-workshop-section"
          id="idea-workshop-section"
          aria-live="polite"
        >
          <!-- Stall-type workshop content is added by JavaScript -->
        </section>
      </main>

      <footer class="site-footer">Made by Robyn and Frances ❤️</footer>
    </div>

    <script src="./script.js?v=5"></script>
  </body>
</html>
